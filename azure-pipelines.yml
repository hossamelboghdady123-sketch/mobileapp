trigger:
  - main

pool:
  name: Default

steps:
  - script: |
      echo "=== TaskFlow CI/CD ==="
      java -version
      mvn -version
      kubectl get nodes
      helm list
    displayName: "Check Build Environment and EKS"

  - script: |
      cd backend/taskflow-api
      mvn clean package -DskipTests
    displayName: "Build Spring Boot Backend"

  - task: Docker@2
    displayName: "Build and Push Docker Image"
    inputs:
      command: buildAndPush
      containerRegistry: docker
      repository: hossam789/taskflow-api
      Dockerfile: backend/taskflow-api/Dockerfile
      tags: |
        $(Build.BuildId)
        latest

  - script: |
      set -e

      echo "=== Deploying TaskFlow to EKS ==="

      helm upgrade --install taskflow ./helm/taskflow \
        --namespace default \
        --set image.tag=$(Build.BuildId) \
        --wait \
        --timeout 5m

      kubectl rollout status deployment/taskflow-api \
        --namespace default \
        --timeout=180s

      kubectl get pods -l app=taskflow-api
      kubectl get svc taskflow-api
    displayName: "Deploy to AWS EKS with Helm"
