trigger:
  - main

pool:
  name: Default

steps:
  - script: |
      echo "=== TaskFlow CI ==="
      echo "Host: $(hostname)"
      echo "User: $(whoami)"
      java -version
      mvn -version
    displayName: "Environment Check"

  - script: |
      cd backend/taskflow-api
      mvn clean package -DskipTests
    displayName: "Build Backend"

  - task: Docker@2
    displayName: "Build and Push Docker Image"
    inputs:
      command: buildAndPush
      containerRegistry: docker
      repository: hossam789/taskflow-api
      Dockerfile: backend/taskflow-api/Dockerfile
      tags: |
        $(Build.BuildId)
        latest
